<style>
/* Enhanced Navigation Styles */
.nav-burger {
  @apply w-6 h-6 flex flex-col justify-center items-center;
}

.burger-line {
  @apply w-6 h-0.5 bg-navy-900 transition-all duration-300 ease-in-out;
}

.burger-line:not(:last-child) {
  @apply mb-1;
}

/* Mobile nav menu open state */
#nav-menu.open {
  @apply translate-y-0 opacity-100;
}

/* Burger animation when menu is open */
#nav-toggle.open .burger-line:nth-child(1) {
  @apply rotate-45 translate-y-1.5;
}

#nav-toggle.open .burger-line:nth-child(2) {
  @apply opacity-0;
}

#nav-toggle.open .burger-line:nth-child(3) {
  @apply -rotate-45 -translate-y-1.5;
}

/* Mobile navigation links */
.mobile-nav-link {
  @apply flex items-center space-x-3 px-4 py-3 text-navy-700 hover:text-patriot-red hover:bg-gray-50 rounded-lg transition-all duration-200 font-medium;
}

/* Navigation scroll effect */
#main-nav.scrolled {
  @apply bg-white/98 shadow-lg;
}

#main-nav.scrolled .container-wide > div {
  @apply h-14;
}
</style>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const nav = document.getElementById('main-nav');
    const toggle = document.getElementById('nav-toggle');
    const menu = document.getElementById('nav-menu');
    const navLinks = document.querySelectorAll('.mobile-nav-link');
    
    // Mobile menu toggle
    if (toggle && menu) {
      toggle.addEventListener('click', () => {
        const isOpen = menu.classList.contains('open');
        
        if (isOpen) {
          menu.classList.remove('open');
          toggle.classList.remove('open');
          toggle.setAttribute('aria-expanded', 'false');
          document.body.classList.remove('overflow-hidden');
        } else {
          menu.classList.add('open');
          toggle.classList.add('open');
          toggle.setAttribute('aria-expanded', 'true');
          document.body.classList.add('overflow-hidden');
        }
      });
    }

    // Close mobile menu when clicking on nav links
    navLinks.forEach(link => {
      link.addEventListener('click', () => {
        menu.classList.remove('open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('overflow-hidden');
      });
    });

    // Enhanced navigation scroll effect
    function handleNavScroll() {
      const scrollY = window.scrollY;
      
      if (scrollY > 50) {
        nav.classList.add('scrolled');
      } else {
        nav.classList.remove('scrolled');
      }
    }

    window.addEventListener('scroll', handleNavScroll);
    
    // Close mobile menu when clicking outside
    document.addEventListener('click', function(event) {
      if (!nav.contains(event.target) && menu.classList.contains('open')) {
        menu.classList.remove('open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('overflow-hidden');
      }
    });

    // Close mobile menu on escape key
    document.addEventListener('keydown', function(event) {
      if (event.key === 'Escape' && menu.classList.contains('open')) {
        menu.classList.remove('open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('overflow-hidden');
      }
    });

    // Handle resize to close mobile menu on desktop
    window.addEventListener('resize', function() {
      if (window.innerWidth >= 1024 && menu.classList.contains('open')) {
        menu.classList.remove('open');
        toggle.classList.remove('open');
        toggle.setAttribute('aria-expanded', 'false');
        document.body.classList.remove('overflow-hidden');
      }
    });
  });
</script>
